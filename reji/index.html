<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Yayın Katmanı</title>
<style>
  :root { --u: calc(min(100vw, 177.78vh) / 100); --main: #0b3d91; }
  @media (orientation: portrait) { :root { --u: calc(100vw / 56); } }
  html { font-size: var(--u); }
  html, body { margin: 0; height: 100%; background: transparent; overflow: hidden;
    font-family: 'Segoe UI', Roboto, Arial, sans-serif; }
  .fade { transition: opacity .5s, transform .5s; }

  /* ÜST */
  .top { position: absolute; top: 2rem; left: 2rem; right: 2rem; display: flex;
    justify-content: space-between; align-items: flex-start; }
  .top.hide { opacity: 0; transform: translateY(-4rem); }
  .live { display: flex; border-radius: .6rem; overflow: hidden; box-shadow: 0 .3rem 1rem rgba(0,0,0,.4); }
  .live .badge { background: #d90000; color: #fff; font-weight: 800; font-size: 2rem; padding: .7rem 1.5rem;
    display: flex; align-items: center; gap: .8rem; letter-spacing: .1rem; }
  .dot { width: 1.3rem; height: 1.3rem; border-radius: 50%; background: #fff; animation: blink 1s infinite; }
  @keyframes blink { 50% { opacity: .15; } }
  .live .loc { background: rgba(10,10,10,.82); color: #fff; font-size: 2rem; font-weight: 600; padding: .7rem 1.5rem; }
  .logo img { max-height: 7rem; max-width: 18rem; display: block; filter: drop-shadow(0 .2rem .5rem rgba(0,0,0,.5)); }
  .logo .txt { background: var(--main); color: #fff; font-weight: 800; font-size: 2rem; padding: .8rem 1.6rem;
    border-radius: .6rem; box-shadow: 0 .3rem 1rem rgba(0,0,0,.4); border-bottom: .3rem solid #fff; transition: background .4s; }

  /* KJ */
  .kj { position: absolute; left: 2rem; right: 2rem; bottom: 6.8rem; filter: drop-shadow(0 .4rem 1rem rgba(0,0,0,.45)); }
  body.no-ticker .kj { bottom: 2rem; }
  .kj.hide { opacity: 0; transform: translateY(8rem); }
  .kj .cat { display: inline-block; background: #fff; color: var(--main); font-weight: 900; font-size: 1.9rem;
    text-transform: uppercase; letter-spacing: .12rem; padding: .5rem 1.8rem; border-radius: .6rem .6rem 0 0; transition: color .4s; }
  .kj .title { background: var(--main); color: #fff; font-weight: 800; font-size: 3.6rem; line-height: 1.15;
    padding: 1.1rem 2rem; transition: background .4s; }
  .kj .sub { background: #fff; color: #111; font-weight: 600; font-size: 2.1rem; padding: .7rem 2rem; }
  .kj .sub:empty { display: none; }
  .kj.swap .cat, .kj.swap .title, .kj.swap .sub { animation: slideIn .6s cubic-bezier(.2,.8,.2,1) both; }
  .kj.swap .title { animation-delay: .08s; } .kj.swap .sub { animation-delay: .16s; }
  @keyframes slideIn { from { transform: translateX(-6rem); opacity: 0; } to { transform: none; opacity: 1; } }
  body.breaking .kj .title { animation: pulse 1.2s infinite; }
  @keyframes pulse { 50% { filter: brightness(1.35); } }

  /* TICKER */
  .ticker { position: absolute; left: 0; right: 0; bottom: 0; height: 4.4rem; display: flex; background: #111; }
  .ticker.hide { opacity: 0; transform: translateY(5rem); }
  .tk-wrap { flex: 1; overflow: hidden; display: flex; align-items: center; }
  .tk-track { display: inline-flex; white-space: nowrap; color: #fff; font-size: 2.1rem; font-weight: 600;
    animation: marquee linear infinite; will-change: transform; }
  .tk-track span { padding-right: 3rem; }
  @keyframes marquee { to { transform: translateX(-50%); } }
  .clock { background: var(--main); color: #fff; font-weight: 800; font-size: 2.3rem; padding: 0 2rem;
    display: flex; align-items: center; transition: background .4s; }
</style>
</head>
<body>
  <div class="top fade" id="top">
    <div class="live"><div class="badge"><span class="dot"></span><span id="liveText">CANLI</span></div><div class="loc" id="loc"></div></div>
    <div class="logo" id="logo"></div>
  </div>

  <div class="kj fade" id="kj">
    <div class="cat" id="cat"></div>
    <div class="title" id="title"></div>
    <div class="sub" id="sub"></div>
  </div>

  <div class="ticker fade" id="ticker">
    <div class="tk-wrap"><div class="tk-track" id="track"></div></div>
    <div class="clock" id="clock">--:--</div>
  </div>

<script src="store.js"></script>
<script>
  const $ = id => document.getElementById(id);
  let lastKJ = null, lastTK = null, cur = null;

  function buildTicker(s) {
    const key = JSON.stringify([s.ticker.items, s.ticker.speed]);
    if (key === lastTK) return; lastTK = key;
    const track = $('track');
    if (!s.ticker.items.length) { track.innerHTML = ''; return; }
    const one = s.ticker.items.map(t => '<span>' + esc(t) + '</span>').join('<span>●</span>') + '<span>●</span>';
    track.innerHTML = '<div style="display:inline-flex">' + one + '</div><div style="display:inline-flex">' + one + '</div>';
    requestAnimationFrame(() => {
      const w = track.firstChild.getBoundingClientRect().width;
      const px = parseFloat(getComputedStyle(document.documentElement).fontSize);
      track.style.animationDuration = Math.max(5, w / (Math.max(1, s.ticker.speed) * px)) + 's';
    });
  }
  const esc = t => String(t).replace(/[&<>]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]));

  function render(s) {
    cur = s;
    document.body.classList.toggle('breaking', !!s.breaking);
    document.body.classList.toggle('no-ticker', !s.ticker.visible);
    document.documentElement.style.setProperty('--main', s.breaking ? s.theme.breaking : s.theme.normal);

    $('top').classList.toggle('hide', !s.top.visible);
    $('liveText').textContent = s.top.liveText;
    $('loc').textContent = s.top.location;
    $('logo').innerHTML = s.brand.logo ? '<img src="' + s.brand.logo + '">' : '<div class="txt">' + esc(s.brand.name) + '</div>';

    const cat = s.breaking ? 'SON DAKİKA' : s.kj.category;
    $('cat').textContent = cat; $('title').textContent = s.kj.title; $('sub').textContent = s.kj.sub;
    $('kj').classList.toggle('hide', !s.kj.visible || !s.kj.title);
    const key = cat + '|' + s.kj.title + '|' + s.kj.sub;
    if (lastKJ !== null && key !== lastKJ) { const k = $('kj'); k.classList.remove('swap'); void k.offsetWidth; k.classList.add('swap'); }
    lastKJ = key;

    $('ticker').classList.toggle('hide', !s.ticker.visible);
    buildTicker(s);
  }

  function tick() { $('clock').textContent = new Date().toLocaleTimeString('tr-TR', { hour: '2-digit', minute: '2-digit' }); }
  setInterval(tick, 1000); tick();
  addEventListener('resize', () => { lastTK = null; if (cur) buildTicker(cur); });

  Store.on(render);
  Store.autoConnect(false);
</script>
</body>
</html>
